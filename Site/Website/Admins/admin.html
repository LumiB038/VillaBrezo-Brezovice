<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paneli Admin - Villa Brezo</title>
<style>
  :root {
    --green: #2f9e63;
    --green-dark: #267d4e;
    --dark: #17251e;
    --bg: #eef4ef;
    --card: #fff;
    --text: #1d2b24;
    --muted: #718078;
    --line: #e3ebe5;
  }
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: var(--bg); margin: 0; color: var(--text); }

  header { background: var(--dark); color: #fff; padding: 14px max(24px, calc((100% - 1300px) / 2));
           display: flex; justify-content: space-between; align-items: center; gap: 24px;
           box-shadow: 0 5px 18px rgba(23,37,30,.14); }
  header .brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: bold;
           white-space: nowrap; }
  header .brand::before { content: "VB"; display: grid; place-items: center; width: 36px; height: 36px;
           border: 1px solid rgba(255,255,255,.3); border-radius: 10px; color: #b9efcc; font-size: 13px; }
  header .brand span { display: block; margin-top: 2px; color: #a7dbb8; font-size: 11px;
           font-weight: normal; letter-spacing: .3px; }
  header nav { display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid rgba(255,255,255,.12);
           border-radius: 12px; background: rgba(255,255,255,.06); }
  header nav a { color: #d7e8dc; padding: 9px 13px; border-radius: 8px; text-decoration: none; font-size: 13px;
           transition: background .2s, color .2s; }
  header nav a.menu-aktiv { color: #fff; background: rgba(255,255,255,.14); }
  header nav a:hover { color: #fff; background: rgba(255,255,255,.1); }
  header nav a:last-child { color: #ffd2d2; }

  main { padding: 34px 24px 48px; max-width: 1300px; margin: 0 auto; }
  main::before { content: "Përmbledhje e menaxhimit"; display: block; margin-bottom: 22px;
           color: var(--muted); font-size: 14px; }
  #paneli, #rezervimet { scroll-margin-top: 24px; }
  #rezervimet { display: none; }
  #rezervimet.e-hapur { display: block; }
  #paneli.e-fshehur { display: none; }
  .seksioni-titull { display: flex; justify-content: space-between; align-items: end;
           gap: 12px; margin: 28px 0 14px; }
  .seksioni-titull h2 { margin: 0; color: var(--text); font-size: 20px; }
  .seksioni-titull p { margin: 0; color: var(--muted); font-size: 13px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat { position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line);
          border-radius: 15px; padding: 20px; box-shadow: 0 5px 18px rgba(23,37,30,.06); }
  .stat::after { content: ""; position: absolute; right: -18px; bottom: -28px; width: 82px; height: 82px;
          border-radius: 50%; background: rgba(47,158,99,.09); }
  .stat .n { font-size: 28px; font-weight: bold; letter-spacing: -.5px; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 7px; }
  .stat.s-pritje { border-left-color: #f0ad4e; }
  .stat.s-konfirmuar { border-left-color: var(--green); }
  .stat.s-anuluar { border-left-color: #c0392b; }
  .stat.s-euro { border-left-color: #0d6efd; }

  .toolbar { display: flex; justify-content: space-between; align-items: center;
             flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
  .filtrat { display: flex; flex-wrap: wrap; gap: 7px; }
  .filtrat button { padding: 9px 14px; border: 1px solid #d5e0d8; background: #fff;
                    color: var(--muted); border-radius: 9px; cursor: pointer; font-size: 13px; }
  .filtrat button:hover { border-color: var(--green); color: var(--green-dark); }
  .filtrat button.aktiv { background: var(--dark); color: #fff; border-color: var(--dark); }
  .kerko { padding: 11px 15px; border: 1px solid #d5e0d8; border-radius: 10px;
           color: var(--text); background: #fff; font-size: 14px; min-width: 270px; max-width: 100%; }
  .kerko:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(47,158,99,.12); }

  .tabela-kutia { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 15px;
                  box-shadow: 0 5px 18px rgba(23,37,30,.06); }
  table { border-collapse: collapse; width: 100%; min-width: 980px; }
  th, td { padding: 14px 15px; text-align: left; border-bottom: 1px solid var(--line);
           font-size: 14px; vertical-align: middle; }
  th { background: #f7faf7; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #f8fcf9; }
  .mysafiri b { display: block; }
  .mysafiri small, .nete { color: var(--muted); font-size: 12px; }

  .status { display: inline-block; padding: 5px 10px; border-radius: 7px; font-size: 11px;
            font-weight: bold; white-space: nowrap; }
  .st-pritje { background: #fff4d6; color: #956b08; }
  .st-konfirmuar { background: #dcf4e3; color: #247044; }
  .st-anuluar { background: #ffe1e3; color: #a23943; }

  td.veprime { white-space: nowrap; }
  td.veprime button { padding: 7px 10px; border: 0; border-radius: 7px; color: #fff;
                      cursor: pointer; margin: 2px 3px 2px 0; font-size: 12px; font-weight: bold; }
  .b-po { background: var(--green); }
  .b-po:hover { background: var(--green-dark); }
  .b-jo { background: #c0392b; }
  .b-edito { background: #3d7dcc; }
  .b-fshij { background: #6c757d; }
  .bosh { padding: 52px 36px; text-align: center; color: var(--muted); }

  /* Dritaret */
  .mbulese { position: fixed; inset: 0; background: rgba(17,29,23,.62); display: none;
             align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .mbulese.hapur { display: flex; }
  .dritare { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 400px;
             box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .dritare h3 { margin: 0 0 14px; }
  .dritare label { display: block; font-size: 13px; margin: 10px 0 4px; }
  .dritare input { width: 100%; padding: 11px; border: 1px solid #d5e0d8; border-radius: 8px; font-size: 14px; }
  .dritare .gabim { color: #c0392b; font-size: 13px; margin-top: 10px; min-height: 16px; }
  .dritare .rreshti { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .dritare .rreshti button { padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer;
                             font-weight: bold; font-size: 14px; }
  .b-ruaj { background: var(--green); color: #fff; }
  .b-anulo { background: #e8eee9; color: #334139; }
  .b-rrezik { background: #c0392b; color: #fff; }

  #njoftimi { position: fixed; right: 20px; bottom: 20px; background: var(--dark); color: #fff;
              padding: 13px 18px; border-radius: 10px; font-size: 14px; display: none; z-index: 60;
              box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  #njoftimi.gabim { background: #c0392b; }

  @media (max-width: 700px) {
    header { padding: 14px 16px; align-items: flex-start; }
    header .brand { font-size: 16px; }
    header .brand span { display: block; margin-top: 3px; }
    header nav { flex-wrap: wrap; justify-content: flex-end; gap: 2px; }
    header nav a { padding: 5px 8px; }
    main { padding: 24px 14px 34px; }
    .kerko { width: 100%; min-width: 0; }
    .toolbar { align-items: stretch; }
    .filtrat { width: 100%; }
    .filtrat button { flex: 1; }
    .tabela-kutia { border-radius: 12px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">Villa Brezo <span>Brezovicë · Paneli Admin</span></div>
  <nav aria-label="Menuja e administrimit">
    <a href="#paneli" class="menu-aktiv" data-seksioni="paneli">Paneli</a>
    <a href="#rezervimet" data-seksioni="rezervimet">Rezervimet</a>
    <a href="/" target="_blank">Shiko faqen</a>
    <a href="/admin/dil">Dil</a>
  </nav>
</header>

<main>
  <section class="stats" id="paneli">
    <div id="statistikat"></div>
  </section>

  <section id="rezervimet">
    <div class="seksioni-titull">
      <div>
        <h2>Rezervimet</h2>
        <p>Menaxho kërkesat dhe qëndrimet e mysafirëve.</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="filtrat" id="filtrat"></div>
      <input class="kerko" id="kerko" type="search" placeholder="Kerko emer, email ose telefon">
    </div>

    <div class="tabela-kutia">
      <table>
        <thead>
          <tr><th>#</th><th>Mysafiri</th><th>Kontakti</th><th>Dhoma</th>
              <th>Datat</th><th>Persona</th><th>Totali</th><th>Kerkesa</th>
              <th>Statusi</th><th>Veprime</th></tr>
        </thead>
        <tbody id="trupi"></tbody>
      </table>
    </div>
  </section>
</main>

<!-- Dritarja per editim -->
<div class="mbulese" id="dritareEdito">
  <div class="dritare">
    <h3 id="editoTitulli">Edito rezervimin</h3>
    <label for="editoHyrja">Data e hyrjes</label>
    <input type="date" id="editoHyrja">
    <label for="editoDalja">Data e daljes</label>
    <input type="date" id="editoDalja">
    <label for="editoPersona">Numri i personave</label>
    <input type="number" id="editoPersona" min="1">
    <div class="gabim" id="editoGabim"></div>
    <div class="rreshti">
      <button class="b-anulo" id="editoMbyll">Mbyll</button>
      <button class="b-ruaj" id="editoRuaj">Ruaj</button>
    </div>
  </div>
</div>

<!-- Dritarja per konfirmim -->
<div class="mbulese" id="dritareKonfirmo">
  <div class="dritare">
    <h3>Konfirmim</h3>
    <p id="konfirmoTeksti"></p>
    <div class="rreshti">
      <button class="b-anulo" id="konfirmoJo">Jo</button>
      <button class="b-rrezik" id="konfirmoPo">Po</button>
    </div>
  </div>
</div>

<div id="njoftimi"></div>

<script>
  // "ne pritje" ne databaze ka shkronjen e me dy pika, prandaj perdorim kodin e saj
  const PRITJE = "n\u00EB pritje";
  const KONFIRMUAR = "konfirmuar";
  const ANULUAR = "anuluar";

  const FILTRAT = [
    { celes: "te_gjitha", emri: "Te gjitha" },
    { celes: PRITJE, emri: "Ne pritje" },
    { celes: KONFIRMUAR, emri: "Konfirmuar" },
    { celes: ANULUAR, emri: "Anuluar" }
  ];

  let te_gjitha = [];
  let filtri = "te_gjitha";
  let kerkimi = "";
  let rezervimiNeEditim = null;

  // ---------- Ndihmese ----------
  function el(tag, tekst, klasa) {
    const e = document.createElement(tag);
    if (tekst !== undefined) e.textContent = tekst;   // textContent = i sigurt nga XSS
    if (klasa) e.className = klasa;
    return e;
  }

  function formatoDaten(iso) {
    const p = String(iso).split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
  }

  function neteQendrimi(r) {
    const a = new Date(r.data_hyrjes);
    const b = new Date(r.data_daljes);
    return Math.round((b - a) / 86400000);
  }

  function klasaStatusit(s) {
    return s === KONFIRMUAR ? "st-konfirmuar" : s === ANULUAR ? "st-anuluar" : "st-pritje";
  }

  function emriStatusit(s) {
    return s === PRITJE ? "ne pritje" : s;
  }

  let njoftimiKohe = null;
  function njofto(tekst, gabim) {
    const n = document.getElementById("njoftimi");
    n.textContent = tekst;
    n.className = gabim ? "gabim" : "";
    n.style.display = "block";
    clearTimeout(njoftimiKohe);
    njoftimiKohe = setTimeout(() => { n.style.display = "none"; }, 3000);
  }

  function pyet(tekst) {
    return new Promise(zgjidh => {
      const kutia = document.getElementById("dritareKonfirmo");
      document.getElementById("konfirmoTeksti").textContent = tekst;
      kutia.classList.add("hapur");
      const mbyll = (vlera) => {
        kutia.classList.remove("hapur");
        po.onclick = null; jo.onclick = null;
        zgjidh(vlera);
      };
      const po = document.getElementById("konfirmoPo");
      const jo = document.getElementById("konfirmoJo");
      po.onclick = () => mbyll(true);
      jo.onclick = () => mbyll(false);
    });
  }

  // ---------- Vizatimi ----------
  function vizatoStatistikat() {
    const kutia = document.getElementById("statistikat");
    kutia.innerHTML = "";
    const pritje = te_gjitha.filter(r => r.statusi === PRITJE).length;
    const konf = te_gjitha.filter(r => r.statusi === KONFIRMUAR);
    const anul = te_gjitha.filter(r => r.statusi === ANULUAR).length;
    const te_ardhura = konf.reduce((s, r) => s + (r.cmimi_total || 0), 0);

    const lista = [
      { n: te_gjitha.length, l: "Rezervime gjithsej", k: "" },
      { n: pritje, l: "Ne pritje", k: "s-pritje" },
      { n: konf.length, l: "Te konfirmuara", k: "s-konfirmuar" },
      { n: anul, l: "Te anuluara", k: "s-anuluar" },
      { n: "\u20AC" + Math.round(te_ardhura), l: "Te ardhura (te konfirmuara)", k: "s-euro" }
    ];
    lista.forEach(s => {
      const d = el("div", undefined, "stat " + s.k);
      d.appendChild(el("div", s.n, "n"));
      d.appendChild(el("div", s.l, "l"));
      kutia.appendChild(d);
    });
  }

  function numroSipasStatusit(celes) {
    return celes === "te_gjitha" ? te_gjitha.length
                                 : te_gjitha.filter(r => r.statusi === celes).length;
  }

  function vizatoFiltrat() {
    const kutia = document.getElementById("filtrat");
    kutia.innerHTML = "";
    FILTRAT.forEach(f => {
      const b = el("button", f.emri + " (" + numroSipasStatusit(f.celes) + ")");
      if (f.celes === filtri) b.className = "aktiv";
      b.onclick = () => { filtri = f.celes; vizatoFiltrat(); vizatoTabelen(); };
      kutia.appendChild(b);
    });
  }

  function perputhetMeKerkimin(r) {
    if (!kerkimi) return true;
    const tekst = (r.emri + " " + r.mbiemri + " " + r.email + " " + r.telefoni).toLowerCase();
    return tekst.includes(kerkimi);
  }

  function vizatoTabelen() {
    const trupi = document.getElementById("trupi");
    trupi.innerHTML = "";
    const lista = te_gjitha.filter(r =>
      (filtri === "te_gjitha" || r.statusi === filtri) && perputhetMeKerkimin(r)
    );

    if (!lista.length) {
      const tr = document.createElement("tr");
      const td = el("td", "Nuk ka rezervime.", "bosh");
      td.colSpan = 10;
      tr.appendChild(td);
      trupi.appendChild(tr);
      return;
    }

    lista.forEach(r => {
      const tr = document.createElement("tr");
      tr.appendChild(el("td", r.id));

      const tdM = el("td", undefined, "mysafiri");
      tdM.appendChild(el("b", r.emri + " " + r.mbiemri));
      tr.appendChild(tdM);

      const tdK = el("td", undefined, "mysafiri");
      tdK.appendChild(el("b", r.telefoni));
      tdK.appendChild(el("small", r.email));
      tr.appendChild(tdK);

      tr.appendChild(el("td", r.dhoma));

      const tdD = el("td", formatoDaten(r.data_hyrjes) + " \u2192 " + formatoDaten(r.data_daljes));
      tdD.appendChild(document.createElement("br"));
      tdD.appendChild(el("span", neteQendrimi(r) + " net", "nete"));
      tr.appendChild(tdD);

      tr.appendChild(el("td", r.persona));
      tr.appendChild(el("td", "\u20AC" + Math.round(r.cmimi_total || 0)));
      tr.appendChild(el("td", r.kerkesat || "-"));

      const tdSt = document.createElement("td");
      tdSt.appendChild(el("span", emriStatusit(r.statusi), "status " + klasaStatusit(r.statusi)));
      tr.appendChild(tdSt);

      const tdV = el("td", undefined, "veprime");
      if (r.statusi !== KONFIRMUAR) {
        const b = el("button", "Konfirmo", "b-po");
        b.onclick = () => ndrysho(r.id, KONFIRMUAR);
        tdV.appendChild(b);
      }
      if (r.statusi !== ANULUAR) {
        const b = el("button", "Anulo", "b-jo");
        b.onclick = async () => {
          if (await pyet("Ta anuloj rezervimin #" + r.id + "?")) ndrysho(r.id, ANULUAR);
        };
        tdV.appendChild(b);
      }

      const bE = el("button", "Edito", "b-edito");
      bE.onclick = () => hapEdito(r);
      tdV.appendChild(bE);

      const bF = el("button", "Fshij", "b-fshij");
      bF.onclick = async () => {
        if (await pyet("Ta fshij pergjithmone rezervimin #" + r.id + "?")) fshij(r.id);
      };
      tdV.appendChild(bF);

      tr.appendChild(tdV);
      trupi.appendChild(tr);
    });
  }

  function rivizato() {
    vizatoStatistikat();
    vizatoFiltrat();
    vizatoTabelen();
  }

  // ---------- API ----------
  async function ngarko() {
    const p = await fetch("/api/admin/rezervimet");
    if (p.status === 401) { location.href = "/admin/login"; return; }
    te_gjitha = await p.json();
    rivizato();
  }

  async function ndrysho(id, statusi) {
    const p = await fetch("/api/admin/rezervimet/" + id + "/statusi", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ statusi })
    });
    if (p.ok) njofto("Statusi u ndryshua."); else njofto("Ndodhi nje gabim.", true);
    ngarko();
  }

  async function fshij(id) {
    const p = await fetch("/api/admin/rezervimet/" + id, { method: "DELETE" });
    if (p.ok) njofto("Rezervimi u fshi."); else njofto("Ndodhi nje gabim.", true);
    ngarko();
  }

  // ---------- Dritarja e editimit ----------
  function hapEdito(r) {
    rezervimiNeEditim = r;
    document.getElementById("editoTitulli").textContent = "Edito rezervimin #" + r.id;
    document.getElementById("editoHyrja").value = r.data_hyrjes;
    document.getElementById("editoDalja").value = r.data_daljes;
    document.getElementById("editoPersona").value = r.persona;
    document.getElementById("editoGabim").textContent = "";
    document.getElementById("dritareEdito").classList.add("hapur");
  }

  function mbyllEdito() {
    document.getElementById("dritareEdito").classList.remove("hapur");
    rezervimiNeEditim = null;
  }

  async function ruajEdito() {
    if (!rezervimiNeEditim) return;
    const hyrja = document.getElementById("editoHyrja").value;
    const dalja = document.getElementById("editoDalja").value;
    const persona = document.getElementById("editoPersona").value;
    const gabimi = document.getElementById("editoGabim");

    const p = await fetch("/api/admin/rezervimet/" + rezervimiNeEditim.id, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data_hyrjes: hyrja, data_daljes: dalja, persona })
    });
    const d = await p.json();
    if (!p.ok) { gabimi.textContent = d.mesazhi || "Ndodhi nje gabim."; return; }
    mbyllEdito();
    njofto("Rezervimi u ndryshua.");
    ngarko();
  }

  document.getElementById("editoMbyll").onclick = mbyllEdito;
  document.getElementById("editoRuaj").onclick = ruajEdito;
  document.getElementById("kerko").addEventListener("input", (e) => {
    kerkimi = e.target.value.trim().toLowerCase();
    vizatoTabelen();
  });

  document.querySelectorAll("[data-seksioni]").forEach((lidhja) => {
    lidhja.addEventListener("click", (e) => {
      e.preventDefault();
      const seksioni = lidhja.dataset.seksioni;
      document.getElementById("paneli").classList.toggle("e-fshehur", seksioni !== "paneli");
      document.getElementById("rezervimet").classList.toggle("e-hapur", seksioni === "rezervimet");
      document.querySelectorAll("[data-seksioni]").forEach((tjeter) => {
        tjeter.classList.toggle("menu-aktiv", tjeter === lidhja);
      });
      history.replaceState(null, "", "#" + seksioni);
    });
  });
  if (location.hash === "#rezervimet") {
    document.querySelector('[data-seksioni="rezervimet"]').click();
  }

  rivizato();
  ngarko();
</script>
</body>
</html>
