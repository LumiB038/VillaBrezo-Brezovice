<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyrje Admin - Villa Brezo</title>
<style>
  body { font-family: Arial, sans-serif; background: #2b2b2b; display: flex;
         align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .kutia { background: #fff; padding: 32px; border-radius: 10px; width: 100%; max-width: 340px; }
  h2 { margin-top: 0; text-align: center; }
  input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc;
          border-radius: 6px; box-sizing: border-box; font-size: 15px; }
  button { width: 100%; padding: 12px; background: #28a745; color: #fff; border: 0;
           border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .gabim { color: #c0392b; text-align: center; margin: 8px 0; }
</style>
</head>
<body>
  <div class="kutia">
    <h2>Villa Brezo - Admin</h2>
    {% if gabim %}<div class="gabim">{{ gabim }}</div>{% endif %}
    <form method="post">
      <input type="password" name="fjalekalimi" placeholder="Fjalëkalimi" required autofocus>
      <button type="submit">Hyr</button>
    </form>
  </div>
</body>
</html>
